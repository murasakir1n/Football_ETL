
version: 2

models:
  - name: count_home_away_wins
    description: "Show counts and difference of home and away teams wins"
    columns:
      - name: id
        description: "The primary key for this table"
        data_tests:
          - unique
          - not_null

  - name: average_goals_per_competition
    description: "Shows average goals per competition"
    columns:
      - name: competition_id
        description: "The primary key for this table"
        data_tests:
          - unique
          - not_null
  - name: average_age_by_nationality
    description: "Shows average age of players by nationality"
    columns:
      - name: date_of_birth
        description: "Key column for this view"
        data_test:
          - not null